<!DOCTYPE html>
<html lang="ka"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6bff"><meta name="apple-mobile-web-app-capable" content="yes">
<title>VII-გ კლასი</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f2f6ff;--card:#fff;--tx:#14213d;--mu:#6b7a99;--pr:#2f6bff;--pl:#e3ebff;--bd:#dbe4f7}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#151b2e;--card:#202845;--tx:#eef2ff;--mu:#9aa8cc;--pr:#5b8cff;--pl:#2a3563;--bd:#303b66}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Georgian",sans-serif;display:flex;font-size:15px}
#app{display:flex;width:100%;height:100%}
nav{width:76px;background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:8px 0;overflow-y:auto;flex:none}
nav button{background:none;border:0;color:var(--mu);padding:10px 2px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px;word-break:break-all;text-align:center}
nav button span{font-size:22px}nav button.on{color:var(--pr);background:var(--pl);border-radius:12px;margin:0 4px}
main{flex:1;overflow-y:auto;padding:14px;min-width:0;display:flex;flex-direction:column}main>*{flex:none}
h2{margin:0 0 12px;font-size:20px}h3{margin:14px 0 8px;font-size:16px}
.c{background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--pr);border-radius:14px;padding:12px;margin-bottom:10px}
.w{border-left-color:#f5a623}.mu{color:var(--mu);font-size:13px}.row{display:flex;gap:8px;align-items:center}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:8px}
.b{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:600;white-space:nowrap}
.b.g{background:var(--pl);color:var(--pr)}.x{background:none;border:0;color:#d33;font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px}.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:20px;font:inherit}.tabs .on{background:var(--pr);color:#fff}
#chat{flex:1 1 auto!important;min-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.m{max-width:85%;padding:8px 10px;border-radius:14px;background:var(--card);border:1px solid var(--bd);align-self:flex-start;word-break:break-word}
.m.me{align-self:flex-end;background:var(--pl)}.m img{max-width:100%;border-radius:8px;margin-top:4px}.m b{font-size:12px;color:var(--pr)}
.auth{margin:auto;width:100%;max-width:340px;text-align:center}.auth h1{color:var(--pr)}
.badge{background:#e53935;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px}
#toast{position:fixed;top:12px;left:90px;right:12px;background:var(--pr);color:#fff;padding:12px;border-radius:12px;display:none;z-index:9}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile,sendEmailVerification,reauthenticateWithCredential,EmailAuthProvider} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,addDoc,deleteDoc,updateDoc,onSnapshot,query,orderBy,limit,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ROOT="axmedovaqsin07@gmail.com";
const app=initializeApp({apiKey:"AIzaSyBeofztj-M-jadiYfPLEnzbGlsAjDIvoOo",authDomain:"sinif-app-9f872.firebaseapp.com",projectId:"sinif-app-9f872",storageBucket:"sinif-app-9f872.firebasestorage.app",messagingSenderId:"286871672472",appId:"1:286871672472:web:3bd87d5eb1be24601fa2ed"});
const auth=getAuth(app),db=getFirestore(app);
const DAYS=["ორშაბათი","სამშაბათი","ოთხშაბათი","ხუთშაბათი","პარასკევი"];
const TT=[["მათემატიკა","ქართული ენა","ბიოლოგია","ინგლისური ენა","ფიზიკა","მუსიკა","გეოგრაფია"],["მათემატიკა","ქიმია","საქ. ისტორია","რუსული/ფრანგული","ხელოვნება","ქართული ლიტ.","ფიზ. აღზრდა"],["მათემატიკა","გეოგრაფია","ქართული ლიტ.","ბიოლოგია","ქართული ენა","მუსიკა","ინგლისური ენა"],["მოქალაქეობა","ქიმია","მათემატიკა","ისტორია","ინგლისური ენა","ქართული ლიტ.","ფიზ. აღზრდა"],["მათემატიკა","ხელოვნება","რუსული/ფრანგული","ფიზიკა","ქართული ლიტ.","საქ. ისტორია"]];
const NAV=[["home","🏠","მთავარი"],["chat","💬","ჩატი"],["hw","📝","დავალებები"],["tt","📅","ცხრილი"],["tests","🧪","შემაჯამებლები"],["ev","🎉","ღონისძიებები"],["more","⋯","მეტი"]];
const OPTS=[...new Set(TT.flat())].map(s=>`<option>${s}</option>`).join("");
const ERR={"auth/invalid-credential":"არასწორი ელფოსტა ან პინი","auth/wrong-password":"არასწორი პინი","auth/user-not-found":"ანგარიში ვერ მოიძებნა","auth/email-already-in-use":"ეს ელფოსტა უკვე არსებობს","auth/weak-password":"პინი უნდა იყოს 6 ციფრი","auth/invalid-email":"ელფოსტა არასწორია","auth/too-many-requests":"ძალიან ბევრი მცდელობა, სცადეთ მოგვიანებით"};

let U=null,unlocked=false,justAuthed=false,tab="home",day=Math.min((new Date().getDay()+6)%7,4),mode="login",err="",open=null,unsubs=[],noteUn=null,first=true,notes=[];
const D={msgs:[],hw:[],reqs:[],tests:[],events:[],duty:"",admins:[],users:[]};
const $=id=>document.getElementById(id);
const esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val=id=>($(id)||{}).value||"";
const nm=()=>U.displayName||U.email.split("@")[0];
const adm=()=>!!U&&U.emailVerified&&(U.email.toLowerCase()===ROOT||D.admins.includes(U.email.toLowerCase()));
const pend=()=>D.reqs.filter(r=>!r.done&&r.uid!==U.uid);
const today=()=>new Date().toISOString().slice(0,10);
const col=n=>collection(db,n);
function pic(f,cb){const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,500/i.width),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.55))};i.src=r.result};r.readAsDataURL(f)}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",5000)}
const safe=fn=>async(...a)=>{try{await fn(...a)}catch(e){console.error(e);alert("შეცდომა: "+(ERR[e.code]||e.code||e.message))}};

onAuthStateChanged(auth,async u=>{
 if(u){try{await u.reload();await u.getIdToken(true)}catch(e){}}
 U=auth.currentUser;unlocked=!!U&&justAuthed;justAuthed=false;stop();if(unlocked)start();draw()});

function stop(){unsubs.forEach(f=>f());unsubs=[];if(noteUn)noteUn();noteUn=null;first=true}
function start(){const er=e=>console.error(e),q=(c,...a)=>query(col(c),...a),L=s=>s.docs.map(d=>({id:d.id,...d.data()}));
 unsubs=[
 onSnapshot(q("messages",orderBy("ts","desc"),limit(100)),s=>{D.msgs=L(s).reverse();fill()},er),
 onSnapshot(q("homework",orderBy("ts","desc")),s=>{D.hw=L(s);fill()},er),
 onSnapshot(q("requests",orderBy("ts","desc")),s=>{D.reqs=L(s);
  if(!first)s.docChanges().forEach(c=>{if(c.type==="added"){const r=c.doc.data();if(r.uid!==U.uid){const t=`🔔 ${r.name}-ს სჭირდება დავალება: ${r.subj}`;toast(t);try{navigator.vibrate&&navigator.vibrate(200);if(Notification.permission==="granted")new Notification("VII-გ",{body:t})}catch(e){}}}});
  first=false;fill()},er),
 onSnapshot(q("tests",orderBy("date")),s=>{D.tests=L(s);fill()},er),
 onSnapshot(q("events",orderBy("d")),s=>{D.events=L(s);fill()},er),
 onSnapshot(doc(db,"settings","duty"),s=>{D.duty=s.exists()?s.data().name:"";fill()},er),
 onSnapshot(col("admins"),s=>{D.admins=s.docs.map(d=>d.id);fill()},er),
 onSnapshot(col("users"),s=>{D.users=L(s);fill()},er)]}

function authUI(){const r=mode==="reg";return `<main style="justify-content:center"><div class="auth"><h1>🎓 VII-გ კლასი</h1><p class="mu">${r?"ანგარიშის შექმნა":"შესვლა"}</p>
 ${r?'<input id="n" placeholder="სახელი და გვარი">':""}<input id="e" type="email" placeholder="ელფოსტა">
 <input id="p" type="password" inputmode="numeric" maxlength="6" placeholder="პინ-კოდი (6 ციფრი)">
 <div style="color:#d33;min-height:20px">${esc(err)}</div>
 <button class="b" style="width:100%" onclick="A.${r?"reg":"login"}()">${r?"რეგისტრაცია":"შესვლა"}</button>
 <p><a href="#" onclick="A.mode();return false" style="color:var(--pr)">${r?"უკვე მაქვს ანგარიში":"ახალი ანგარიში"}</a></p></div></main>`}
function lockUI(){return `<main style="justify-content:center"><div class="auth"><h1>🔒</h1><p><b>${esc(nm())}</b></p>
 <input id="p" type="password" inputmode="numeric" maxlength="6" placeholder="შეიყვანე პინ-კოდი" onkeydown="if(event.key==='Enter')A.unlock()">
 <div style="color:#d33;min-height:20px">${esc(err)}</div><button class="b" style="width:100%" onclick="A.unlock()">შესვლა</button>
 <p><a href="#" onclick="A.out();return false" style="color:var(--pr)">სხვა ანგარიში</a></p></div></main>`}

const V={
 home:()=>`<div id="v"></div>`,
 chat:()=>`<h2>ჩატი</h2><div id="chat"></div><div id="blk" style="color:#d33"></div><div class="row" style="margin-top:8px"><label class="b g">📷<input type="file" accept="image/*" hidden onchange="A.img(this)"></label><input id="mt" placeholder="შეტყობინება..." style="margin:0" onkeydown="if(event.key==='Enter')A.send()"><button class="b" onclick="A.send()">➤</button></div>`,
 hw:()=>`<h2>დავალებები</h2><div class="c w"><div class="mu">დავალება არ იცი?</div><div class="row"><select id="rs" style="margin:0">${OPTS}</select><button class="b" onclick="A.addReq()">🙏 მჭირდება</button></div></div><div id="rql"></div>
 <h3>ახალი დავალება</h3><div class="c"><select id="hs">${OPTS}</select><textarea id="ht" rows="2" placeholder="დავალება..."></textarea><button class="b" onclick="A.addHw()">დამატება</button></div><div id="hwl"></div>`,
 tt:()=>`<h2>ცხრილი · VII-გ</h2><div class="tabs">${DAYS.map((d,i)=>`<button class="${i===day?"on":""}" onclick="A.day(${i})">${d}</button>`).join("")}</div><div class="c">${TT[day].map((s,i)=>`<div style="padding:6px 0;border-bottom:1px solid var(--bd)"><span class="badge" style="background:var(--pr)">${i+1}</span> ${s}</div>`).join("")}</div><p class="mu">კლასის დამრიგებელი: ირინე იობაძე</p>`,
 tests:()=>`<h2>შემაჯამებლები</h2><div id="ta"></div><div id="tl"></div>`,
 ev:()=>`<h2>ღონისძიებები</h2><div class="c"><input id="et" placeholder="ღონისძიების სახელი"><input id="ed" type="date"><button class="b" onclick="A.addEv()">დამატება</button></div><div id="el"></div>`,
 more:()=>`<h2>მეტი</h2><div id="mv"></div>`};

const F={
 home(){const t=D.tests.find(x=>x.date>=today()),p=pend()[0],h=D.hw[0];
  $("v").innerHTML=`<h2>გამარჯობა, ${esc(nm())} 👋</h2>
  ${p?`<div class="c w" onclick="A.go('hw')">🔔 <b>${esc(p.name)}</b>-ს სჭირდება დავალება: <b>${esc(p.subj)}</b>${pend().length>1?` (+${pend().length-1})`:""}</div>`:""}
  <div class="c"><div class="mu">დღეს · ${DAYS[day]}</div>${TT[day].map((s,i)=>`<div>${i+1}. ${s}</div>`).join("")}</div>
  <div class="c"><div class="mu">უახლოესი შემაჯამებელი</div>${t?`<b>${esc(t.subj)}</b> · ${esc(t.date)}<div class="mu">${esc(t.topic)}</div>`:"არ არის"}</div>
  <div class="c"><div class="mu">მორიგე მოსწავლე</div><b>${esc(D.duty||"არ არის მითითებული")}</b></div>
  <div class="c"><div class="mu">ბოლო დავალება</div>${h?`<b>${esc(h.subj)}</b>: ${esc(h.text)}`:"არ არის"}</div>`},
 chat(){const c=$("chat");if(!c)return;const near=c.scrollHeight-c.scrollTop-c.clientHeight<100||!c.innerHTML;
  c.innerHTML=D.msgs.map(m=>`<div class="m ${m.uid===U.uid?"me":""}"><b>${esc(m.name)}</b>${adm()?` <button class="x" onclick="A.del('${m.id}')">✕</button>`:""}<div>${esc(m.t)}</div>${String(m.img||"").startsWith("data:image/")?`<img src="${m.img}">`:""}</div>`).join("")||'<p class="mu">შეტყობინებები ჯერ არ არის</p>';
  if(near)c.scrollTop=c.scrollHeight;const l=D.msgs[D.msgs.length-1],left=l&&l.uid===U.uid&&l.run>=50?Math.ceil((600000-(Date.now()-l.ts))/60000):0;$("blk").textContent=left>0?`⏳ ზედმეტი შეტყობინებები. სცადეთ ${left} წუთში.`:""},
 hw(){$("rql").innerHTML=D.reqs.filter(r=>!r.done).map(r=>`<div class="c w"><b>📣 ${esc(r.name)}-ს სჭირდება: ${esc(r.subj)}</b>${(r.answers||[]).map(a=>`<div class="mu"><b>${esc(a.name)}:</b> ${esc(a.t)}</div>`).join("")}<div class="row" style="margin-top:6px"><input id="ra${r.id}" placeholder="დაწერე დავალება..." style="margin:0"><button class="b" onclick="A.ans('${r.id}')">➤</button></div>${r.uid===U.uid||adm()?`<button class="b g" style="margin-top:6px" onclick="A.close('${r.id}')">მივიღე ✅</button>`:""}</div>`).join("");
  $("hwl").innerHTML=D.hw.map(h=>`<div class="c"><b>${esc(h.subj)}</b> <span class="mu">· ${esc(h.name)}</span>${adm()||h.uid===U.uid?` <button class="x" onclick="A.delHw('${h.id}')">✕</button>`:""}<div>${esc(h.text)}</div></div>`).join("")},
 tt(){},
 tests(){$("ta").innerHTML=adm()?`<div class="c"><select id="ts">${OPTS}</select><input id="td" type="date"><input id="tp" placeholder="თემა"><button class="b" onclick="A.addTest()">დამატება</button></div>`:"";
  $("tl").innerHTML=D.tests.map(t=>`<div class="c"><div class="row"><div style="flex:1"><b>${esc(t.subj)}</b> · ${esc(t.date)}<div class="mu">${esc(t.topic)}</div></div><button class="b g" onclick="A.toggle('${t.id}')">＋</button>${adm()?`<button class="x" onclick="A.delTest('${t.id}')">✕</button>`:""}</div>${open===t.id?`<div style="margin-top:8px"><div id="nl"></div><div class="row" style="margin-top:6px"><input id="nt" placeholder="რა იქნება ტესტზე?" style="margin:0"><button class="b" onclick="A.addNote()">➤</button></div></div>`:""}</div>`).join("")||'<p class="mu">შემაჯამებლები ჯერ არ არის</p>';fillNotes()},
 ev(){$("el").innerHTML=D.events.map(e=>`<div class="c"><b>${esc(e.t)}</b> · ${esc(e.d)}<div class="mu">${esc(e.name)}</div>${adm()?`<button class="x" onclick="A.delEv('${e.id}')">✕ წაშლა</button>`:""}</div>`).join("")||'<p class="mu">ღონისძიებები ჯერ არ არის</p>'},
 more(){$("mv").innerHTML=`<div class="c"><div class="mu">მორიგე მოსწავლე</div><b>${esc(D.duty||"—")}</b></div>
  <button class="b g" style="margin-bottom:10px" onclick="A.notif()">🔔 შეტყობინებების ჩართვა</button>
  ${adm()?`<div class="c"><b>👑 ადმინის პანელი</b><input id="du" placeholder="მორიგის სახელი" style="margin-top:8px"><button class="b g" onclick="A.duty()">მორიგის დაყენება</button><input id="ae" type="email" placeholder="ახალი ადმინის ელფოსტა" style="margin-top:8px"><button class="b" onclick="A.addAdmin()">ადმინის დამატება</button>
  <div class="mu" style="margin-top:6px">${D.admins.map(a=>`${esc(a)} <button class="x" onclick="A.rmAdmin('${esc(a)}')">✕</button>`).join("<br>")}</div></div>`:""}
  <div class="c"><div class="mu">კლასელები (${D.users.length})</div>${D.users.map(u=>esc(u.name)).join("<br>")}</div><button class="b g" onclick="A.out()">გასვლა</button>`}};
function fillNotes(){const e=$("nl");if(!e)return;e.innerHTML=notes.map(n=>`<div class="mu"><b>${esc(n.name)}:</b> ${esc(n.t)}</div>`).join("")||'<div class="mu">ჯერ არაფერი</div>'}
function fill(){if(!unlocked||!U||!$("mainv"))return;
 const s=[...document.querySelectorAll("#mainv [id]")].filter(e=>"value" in e&&e.type!=="file").map(e=>[e.id,e.value]);
 try{F[tab]()}catch(e){console.error(e)}
 s.forEach(([i,v])=>{const e=$(i);if(e&&v&&e.value!==v)e.value=v});
 const b=$("nb");if(b){const n=pend().length;b.textContent=n||"";b.style.display=n?"":"none"}}

function draw(){const a=$("app");
 if(!U){a.innerHTML=authUI();return}
 if(!unlocked){a.innerHTML=lockUI();return}
 const vb=U.emailVerified?"":`<div class="c w"><b>📧 დაადასტურე ელფოსტა</b><div class="mu">გამოგიგზავნეთ ბმული. დააჭირე მას და შემდეგ „განახლება“.</div><div class="row" style="margin-top:6px"><button class="b g" onclick="A.refresh()">განახლება</button><button class="b g" onclick="A.resend()">თავიდან გაგზავნა</button></div></div>`;
 a.innerHTML=`<nav>${NAV.map(([k,i,l])=>`<button class="${k===tab?"on":""}" onclick="A.go('${k}')"><span>${i}</span>${l}${k==="hw"?' <b class="badge" id="nb" style="display:none"></b>':""}</button>`).join("")}</nav><main id="mainv">${vb}${V[tab]()}</main>`;
 fill();const c=$("chat");if(c)c.scrollTop=c.scrollHeight}

window.A={
 mode(){mode=mode==="reg"?"login":"reg";err="";draw()},
 async login(){try{justAuthed=true;await signInWithEmailAndPassword(auth,val("e").trim(),val("p"))}catch(e){justAuthed=false;err=ERR[e.code]||e.code;draw()}},
 async reg(){const n=val("n").trim(),e=val("e").trim(),p=val("p");
  if(!n||!e.includes("@")||!/^\d{6}$/.test(p)){err="შეავსეთ ყველა ველი (პინი = 6 ციფრი)";return draw()}
  try{justAuthed=true;const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:n});await setDoc(doc(db,"users",c.user.uid),{name:n,email:e.toLowerCase()});try{await sendEmailVerification(c.user)}catch(x){}U=auth.currentUser;draw()}catch(x){justAuthed=false;err=ERR[x.code]||x.code;draw()}},
 async unlock(){try{await reauthenticateWithCredential(U,EmailAuthProvider.credential(U.email,val("p")));unlocked=true;err="";start();draw()}catch(e){err=ERR[e.code]||"არასწორი პინი";draw()}},
 async out(){await signOut(auth);mode="login";err=""},
 go(t){tab=t;open=null;if(noteUn){noteUn();noteUn=null}draw()},
 day(i){day=i;draw()},
 send:safe(async img=>{img=typeof img==="string"?img:"";const t=val("mt").trim();if(!t&&!img)return;
  const l=D.msgs[D.msgs.length-1];let run=1;
  if(l&&l.uid===U.uid){if(l.run>=50&&Date.now()-l.ts<600000){return F.chat()}run=l.run>=50?1:(l.run||0)+1}
  await addDoc(col("messages"),{uid:U.uid,name:nm(),t,img,ts:Date.now(),run});if($("mt"))$("mt").value=""}),
 img(el){const f=el.files[0];if(f)pic(f,d=>A.send(d));el.value=""},
 del:safe(async id=>{await deleteDoc(doc(db,"messages",id))}),
 addReq:safe(async()=>{await addDoc(col("requests"),{uid:U.uid,name:nm(),subj:val("rs"),ts:Date.now(),done:false,answers:[]})}),
 ans:safe(async id=>{const t=val("ra"+id).trim();if(!t)return;await updateDoc(doc(db,"requests",id),{answers:arrayUnion({uid:U.uid,name:nm(),t,ts:Date.now()})})}),
 close:safe(async id=>{await updateDoc(doc(db,"requests",id),{done:true})}),
 addHw:safe(async()=>{const t=val("ht").trim();if(t.length<3)return alert("ძალიან მოკლეა");await addDoc(col("homework"),{uid:U.uid,name:nm(),subj:val("hs"),text:t,ts:Date.now()});$("ht").value=""}),
 delHw:safe(async id=>{await deleteDoc(doc(db,"homework",id))}),
 addTest:safe(async()=>{if(!val("td"))return;await addDoc(col("tests"),{subj:val("ts"),date:val("td"),topic:val("tp")});$("tp").value=""}),
 delTest:safe(async id=>{await deleteDoc(doc(db,"tests",id))}),
 toggle(id){if(noteUn){noteUn();noteUn=null}notes=[];if(open===id){open=null}else{open=id;noteUn=onSnapshot(query(collection(db,"tests",id,"notes"),orderBy("ts")),s=>{notes=s.docs.map(d=>d.data());fillNotes()},e=>console.error(e))}F.tests()},
 addNote:safe(async()=>{const t=val("nt").trim();if(!t||!open)return;await addDoc(collection(db,"tests",open,"notes"),{uid:U.uid,name:nm(),t,ts:Date.now()});$("nt").value=""}),
 addEv:safe(async()=>{if(!val("et").trim()||!val("ed"))return;await addDoc(col("events"),{uid:U.uid,name:nm(),t:val("et").trim(),d:val("ed")});$("et").value=""}),
 delEv:safe(async id=>{await deleteDoc(doc(db,"events",id))}),
 duty:safe(async()=>{await setDoc(doc(db,"settings","duty"),{name:val("du").trim()})}),
 addAdmin:safe(async()=>{const e=val("ae").trim().toLowerCase();if(!e.includes("@"))return;await setDoc(doc(db,"admins",e),{email:e});$("ae").value=""}),
 rmAdmin:safe(async e=>{if(e!==ROOT)await deleteDoc(doc(db,"admins",e))}),
 notif:safe(async()=>{const r=await Notification.requestPermission();toast(r==="granted"?"✅ ჩართულია (მხოლოდ აპის გახსნისას)":"ვერ ჩაირთო")}),
 refresh:safe(async()=>{await U.reload();await U.getIdToken(true);U=auth.currentUser;draw()}),
 resend:safe(async()=>{await sendEmailVerification(U);toast("გაიგზავნა")})};
draw();
</script></body></html>
